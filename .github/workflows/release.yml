name: Package, release, publish
on:
  push:
    tags: [ v* ]

env:
  # the forge (host) at which the registry lies
  # for Universe, this is Github (https://github.com)
  REGISTRY_FORGE: https://github.com
  # the repository hosting published packages
  # this is cloned to ensure pull requests are based on the latest upstream commit
  # for Universe, this is typst/packages (https://github.com/typst/packages/)
  # the `secrets.REGISTRY_TOKEN` must be able to read from this repo
  REGISTRY_REPO: typst/packages
  # the repository to which to push the release version
  # this should be a fork of the registry repo that you have push privileges to
  # the `secrets.REGISTRY_TOKEN` must be able to push to this repo
  REGISTRY_FORK: sourander/typst-packages
  # the path within the registry repo where the "<name>/<version>" directory should be put
  # for Universe, this is packages/preview
  PATH_PREFIX: kamk-thesis/preview

jobs:

  # The build job is created using the typst/communitytypst-package-template repository as a guide,
  # but fitted for my Python script automation (over Bash scripts) for easier testing and better cross OS support.
  build:
    outputs:
      pkg-name: ${{ steps.metadata.outputs.name }}
      pkg-version: ${{ steps.metadata.outputs.version }}
      pkg-id: ${{ steps.metadata.outputs.id }}
    name: Build package artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Determine and check package metadata
        id: metadata
        run: uv run scripts/typst_package_config.py github-output

      - name: Create package directory
        run: just package out

      - name: Verify expected package directory
        shell: bash
        run: |
          package_dir="out/${{ steps.metadata.outputs.name }}/${{ steps.metadata.outputs.version }}"
          test -d "${package_dir}"
          test -f "${package_dir}/typst.toml"
          test -f "${package_dir}/README.md"
          test -f "${package_dir}/LICENSE"

          echo "Packaged files:"
          find "${package_dir}" -type f | sort

      - name: Create ZIP archive
        shell: bash
        run: |
          mkdir dist
          cd out
          zip -r "../dist/${{ steps.metadata.outputs.id }}.zip" \
            "${{ steps.metadata.outputs.name }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.metadata.outputs.id }}.zip
          archive: false
          retention-days: 5
          if-no-files-found: error

